spring.application.name=customer-service
server.port=${SERVER_PORT:8082}

# --- Base de donnees (tout vient de l'environnement) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/customer_db}
spring.datasource.username=${DB_USER:fintech}
spring.datasource.password=${DB_PASSWORD}

# --- JPA : Flyway construit le schema, Hibernate le verifie seulement ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway (emplacement par defaut : classpath:db/migration) ---
spring.flyway.enabled=true

# --- Actuator : base pour la phase 8 (probes et metriques) ---
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
# --- Valeurs par defaut a l'ouverture d'un compte (fixees par la banque) ---
bank.account.checking-overdraft-limit=${ACCOUNT_OVERDRAFT_LIMIT:500.00}
bank.account.savings-interest-rate=${ACCOUNT_SAVINGS_RATE:0.0350}
bank.account.savings-minimum-balance=${ACCOUNT_SAVINGS_MIN_BALANCE:100.00}
logging.pattern.level=%5p [%X{correlationId:-}]
# --- Securite des appels internes (secret partage, fourni par l'environnement) ---
internal.service-token=${INTERNAL_SERVICE_TOKEN:}
# --- Swagger : desactivable en production (SWAGGER_ENABLED=false) ---
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.groups-order=ASC
springdoc.swagger-ui.operations-sorter=method