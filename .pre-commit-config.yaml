# Local shift-left gate. Install with: scripts/install-hooks.ps1
# Mirrors the blocking checks of CI (secrets, Dockerfile lint, private keys, lint) so problems are
# caught before the push. Revisions are pinned by commit SHA (the tag is in the comment).
minimum_pre_commit_version: "3.5.0"
default_stages: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--config=.gitleaks.toml"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        exclude: ^infra/(helm|k8s)/.*(templates|kustomization)
      - id: check-json
      - id: end-of-file-fixer
        exclude: \.(pdf|png|joblib)$
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
        exclude: \.(pdf|png|joblib|csv)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 9026c9127e153371d7a78dfcb0c45ae2046a3d10 # frozen: v0.17.6
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
        files: ^(mlops|scripts|infra)/.*\.py$

  - repo: https://github.com/hadolint/hadolint
    rev: 2eece55955ced00200be9729e9728cb7dacca505 # frozen: v2.15.1
    hooks:
      - id: hadolint-docker
        args: ["--config", ".hadolint.yaml"]

  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        language: system
        entry: npm --prefix frontend run lint --silent
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
