name: ML CI

on:
  push:
    branches: [main, develop]
    paths: ["ml/**", ".github/workflows/ml-ci.yml"]
  pull_request:
    paths: ["ml/**", ".github/workflows/ml-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ml

jobs:
  build:
    name: Install, compile, smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile all sources (syntax check)
        run: python -m compileall -q src

      - name: Smoke test — load production predictor
        # Known issue: the 29D bundle pickles `src.models.autoencoder` (removed in 5e53d47)
        # and needs `torch`, which is not in requirements.txt. Remove continue-on-error once fixed.
        continue-on-error: true
        run: |
          python -c "
          from src.ml.predictor import RiskPulseMLPredictor
          p = RiskPulseMLPredictor()
          print('Loaded model version', p.version)
          "
