name: ML CI

on:
  push:
    branches: [main, develop]
    paths: ["ml/**", ".github/workflows/ml-ci.yml"]
  pull_request:
    paths: ["ml/**", ".github/workflows/ml-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ml

jobs:
  build:
    name: Install, lint, compile, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ml/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Byte-compile all sources (syntax check)
        run: python -m compileall -q src

      - name: Tests (predictor loads the 29D bundle and scores)
        run: pytest -q --cov=src.ml.predictor --cov=src.models --cov-report=term-missing
