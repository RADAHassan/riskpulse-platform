# Gitleaks configuration for RiskPulse.
# Extends the default ruleset and only allow-lists reviewed, non-secret material.
title = "RiskPulse gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "riskpulse-service-key-literal"
description = "Hard-coded SERVICE_KEY / JWT secret literal"
regex = '''(?i)(service[_-]?key|jwt[_-]?secret|jwt[_-]?private[_-]?key)\s*[:=]\s*["']?[A-Za-z0-9+/_\-]{24,}["']?'''
tags = ["riskpulse", "secret"]
[rules.allowlist]
regexTarget = "match"
regexes = ['''(?i)changeme''', '''\$\{[A-Z_]+\}''', '''secretKeyRef''', '''<[^>]+>''']

[allowlist]
description = "Reviewed, non-secret material"
paths = [
  '''ml/artifacts/.*''',                     # model bundles and result tables (binary / numeric)
  '''docs/reports/.*\.pdf''',
  '''docs/security/gate-evidence\.md''',      # documents the deliberately planted fake secret
  '''(^|/)package-lock\.json$''',
  '''(^|/)\.env\.example$''',                 # placeholders only (CHANGE_ME_*)
  '''infra/k8s/.*/sealed-.*\.yaml''',        # SealedSecret ciphertext (public-key encrypted)
]
regexes = [
  '''CHANGE_ME[A-Z0-9_]*''',
  '''example(-|_)?(key|secret|password)''',
]
