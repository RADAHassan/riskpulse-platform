apiVersion: v1
kind: ServiceAccount
metadata: { name: postgres-exporter, namespace: riskpulse }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: riskpulse
  labels: { app.kubernetes.io/name: postgres-exporter, app.kubernetes.io/part-of: riskpulse }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: postgres-exporter } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres-exporter, app.kubernetes.io/part-of: riskpulse, app: postgres-exporter }
    spec:
      serviceAccountName: postgres-exporter
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: exporter
          image: prometheuscommunity/postgres-exporter:v0.21.1@sha256:3b8e05a84282cd1199ad2fb6c66f362738bf4c68c1547d8f4226a34a7dd6d8d7
          ports: [{ name: metrics, containerPort: 9187 }]
          env:
            - name: POSTGRES_EXPORTER_PASSWORD
              valueFrom: { secretKeyRef: { name: riskpulse-secrets, key: POSTGRES_EXPORTER_PASSWORD } }
            - name: DATA_SOURCE_NAME
              value: "postgresql://exporter:$(POSTGRES_EXPORTER_PASSWORD)@postgres:5432/postgres?sslmode=disable"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { cpu: 100m, memory: 64Mi }
          readinessProbe: { httpGet: { path: /, port: metrics }, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: riskpulse
  labels: { app.kubernetes.io/name: postgres-exporter, app.kubernetes.io/part-of: riskpulse }
spec:
  selector: { app.kubernetes.io/name: postgres-exporter }
  ports: [{ name: metrics, port: 9187, targetPort: metrics }]
