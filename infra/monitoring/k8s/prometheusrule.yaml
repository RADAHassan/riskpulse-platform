# GENERATED by scripts/render_prometheus_rule.py from prometheus/rules/riskpulse-alerts.yml — do not edit.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: riskpulse-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: riskpulse
spec:
  groups:
    - name: riskpulse-availability
      rules:
        - alert: ServiceDown
          expr: up{job=~"riskpulse-.*"} == 0
          for: 1m
          labels: { severity: critical }
          annotations:
            summary: "{{ $labels.application }} is unavailable"
            description: "Prometheus cannot scrape {{ $labels.instance }} (job {{ $labels.job }}) for more than 1 minute."
            runbook: "docs/runbook.md#servicedown"

        - alert: DeploymentUnavailable
          expr: kube_deployment_status_replicas_available{namespace="riskpulse"} == 0
          for: 1m
          labels: { severity: critical }
          annotations:
            summary: "Deployment {{ $labels.deployment }} has no available replica"
            description: "All pods of {{ $labels.deployment }} are down: the service is unavailable."
            runbook: "docs/runbook.md#servicedown"

        - alert: PodFailure
          expr: |
            sum by (namespace, pod) (kube_pod_status_phase{namespace="riskpulse", phase=~"Failed|Unknown"}) > 0
            or
            max by (namespace, pod) (kube_pod_container_status_waiting_reason{namespace="riskpulse", reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError"}) == 1
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "Pod {{ $labels.pod }} is failing"
            description: "Pod {{ $labels.pod }} is Failed/Unknown or stuck in a waiting error state."
            runbook: "docs/runbook.md#podfailure"

        - alert: PodRestartingFrequently
          expr: increase(kube_pod_container_status_restarts_total{namespace="riskpulse"}[15m]) > 3
          for: 1m
          labels: { severity: warning }
          annotations:
            summary: "Container {{ $labels.container }} of {{ $labels.pod }} restarts frequently"
            description: "More than 3 restarts in 15 minutes (CrashLoop suspected)."
            runbook: "docs/runbook.md#podfailure"

    - name: riskpulse-performance
      rules:
        - alert: HighCpuUsage
          # container CPU vs its limit (cAdvisor + kube-state-metrics)
          expr: |
            sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="riskpulse", container!=""}[5m]))
            /
            sum by (pod) (kube_pod_container_resource_limits{namespace="riskpulse", resource="cpu"})
            > 0.80
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "CPU above 80 % of the limit on {{ $labels.pod }}"
            description: "Pod {{ $labels.pod }} uses {{ $value | humanizePercentage }} of its CPU limit."
            runbook: "docs/runbook.md#highcpuusage"

        - alert: HighProcessCpu
          # application level (works in Compose too): JVM process CPU and Python process CPU
          expr: |
            max by (application, instance) (process_cpu_usage{job="riskpulse-spring"}) > 0.80
            or
            max by (application, instance) (rate(process_cpu_seconds_total{job="riskpulse-ml-serving"}[5m])) > 0.80
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "CPU above 80 % in {{ $labels.application }}"
            description: "Process CPU of {{ $labels.application }} ({{ $labels.instance }}) is {{ $value | humanizePercentage }}."
            runbook: "docs/runbook.md#highcpuusage"

        - alert: SlowResponses
          expr: |
            histogram_quantile(0.95,
              sum by (le, application) (rate(http_server_requests_seconds_bucket{job="riskpulse-spring", uri!~"/actuator.*"}[5m]))
            ) > 2
            or
            histogram_quantile(0.95,
              sum by (le, application) (rate(http_request_duration_seconds_bucket{job="riskpulse-ml-serving", handler!~"/metrics|/health.*"}[5m]))
            ) > 2
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "p95 response time above 2 s on {{ $labels.application }}"
            description: "95th percentile latency of {{ $labels.application }} is {{ $value | humanizeDuration }}."
            runbook: "docs/runbook.md#slowresponses"

        - alert: HighErrorRate
          expr: |
            sum by (application) (rate(http_server_requests_seconds_count{job="riskpulse-spring", status=~"5.."}[5m]))
            / sum by (application) (rate(http_server_requests_seconds_count{job="riskpulse-spring"}[5m]))
            > 0.05
            or
            sum by (application) (rate(http_requests_total{job="riskpulse-ml-serving", status=~"5.."}[5m]))
            / sum by (application) (rate(http_requests_total{job="riskpulse-ml-serving"}[5m]))
            > 0.05
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "HTTP 5xx rate above 5 % on {{ $labels.application }}"
            description: "{{ $value | humanizePercentage }} of the requests of {{ $labels.application }} fail with a 5xx."
            runbook: "docs/runbook.md#higherrorrate"

        - alert: HpaAtMaximum
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{namespace="riskpulse"}
            >= kube_horizontalpodautoscaler_spec_max_replicas{namespace="riskpulse"}
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "HPA {{ $labels.horizontalpodautoscaler }} is at its maximum"
            description: "The autoscaler cannot add replicas any more: capacity may be insufficient."
            runbook: "docs/runbook.md#hpaatmaximum"

    - name: riskpulse-ml
      rules:
        - alert: HighMlUncertainty
          # share of predictions whose uncertainty (2*min(p,1-p)) is >= 0.25: they are routed to human review
          expr: |
            (
              1 - sum(rate(riskpulse_ml_prediction_uncertainty_bucket{le="0.25"}[10m]))
                / sum(rate(riskpulse_ml_prediction_uncertainty_count[10m]))
            ) > 0.10
          for: 10m
          labels: { severity: warning, application: ml-serving }
          annotations:
            summary: "High ML uncertainty: more than 10 % of predictions need a human review"
            description: "{{ $value | humanizePercentage }} of the predictions have an uncertainty >= 0.25 (possible data drift)."
            runbook: "docs/runbook.md#highmluncertainty"

        - alert: ReviewQueueGrowing
          expr: riskpulse_review_queue_size > 25 and deriv(riskpulse_review_queue_size[15m]) > 0
          for: 10m
          labels: { severity: warning, application: risk-service }
          annotations:
            summary: "The human review queue keeps growing ({{ $value }} open cases)"
            description: "Analysts are not keeping up with the cases routed to human review."
            runbook: "docs/runbook.md#reviewqueuegrowing"

        - alert: MlServingFallbackActive
          expr: increase(riskpulse_risk_fallbacks_total[5m]) > 0
          for: 1m
          labels: { severity: warning, application: risk-service }
          annotations:
            summary: "Decisions are taken by the HUMAN_REVIEW fallback (ml-serving unavailable)"
            description: "risk-service could not reach ml-serving: transactions are sent to human review instead of being scored."
            runbook: "docs/runbook.md#mlservingfallbackactive"

        - alert: CircuitBreakerOpen
          expr: resilience4j_circuitbreaker_state{state="open"} == 1
          for: 1m
          labels: { severity: warning }
          annotations:
            summary: "Circuit breaker {{ $labels.name }} is open on {{ $labels.application }}"
            description: "Calls to the downstream service are short-circuited."
            runbook: "docs/runbook.md#circuitbreakeropen"

        - alert: AuditTrailGap
          expr: increase(riskpulse_audit_failures_total[10m]) > 0
          for: 1m
          labels: { severity: warning }
          annotations:
            summary: "Audit events could not be delivered ({{ $labels.application }})"
            description: "A gap in the audit trail is possible: check audit-service."
            runbook: "docs/runbook.md#audittrailgap"

    - name: riskpulse-security
      rules:
        - alert: NewCriticalVulnerability
          expr: sum by (namespace, image_repository, image_tag) (trivy_image_vulnerabilities{severity="Critical", namespace="riskpulse"}) > 0
          for: 5m
          labels: { severity: critical, application: security }
          annotations:
            summary: "CRITICAL vulnerability found in {{ $labels.image_repository }}:{{ $labels.image_tag }}"
            description: "Trivy Operator reports {{ $value }} CRITICAL finding(s) in a running image."
            runbook: "docs/runbook.md#newcriticalvulnerability"
