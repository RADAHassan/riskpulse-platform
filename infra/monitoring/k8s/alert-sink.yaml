# In-cluster webhook receiver for Alertmanager (demo): logs alerts and exposes them on /alerts.
apiVersion: v1
kind: ServiceAccount
metadata: { name: alert-sink, namespace: monitoring }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-sink
  namespace: monitoring
  labels: { app.kubernetes.io/name: alert-sink }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: alert-sink } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: alert-sink }
    spec:
      serviceAccountName: alert-sink
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: alert-sink
          image: ghcr.io/radahassan/riskpulse-alert-sink:dev
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 9000 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { cpu: 100m, memory: 64Mi }
          readinessProbe: { httpGet: { path: /alerts, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /alerts, port: http }, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: alert-sink, namespace: monitoring }
spec:
  selector: { app.kubernetes.io/name: alert-sink }
  ports: [{ name: http, port: 9000, targetPort: http }]
