# RiskPulse — full local stack (1 replica per service, ~6 GB RAM).
#   scripts/dev-up.ps1        # generates .env with random secrets, builds, starts, runs the MLflow pipeline
#   scripts/e2e.ps1           # end-to-end test through the gateway
name: riskpulse

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-spring-env: &spring-env
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
  JWT_ISSUER: riskpulse-auth
  JWT_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
  SERVICE_KEY: ${SERVICE_KEY:?SERVICE_KEY is required (run scripts/dev-up.ps1)}
  AUDIT_SERVICE_URL: http://audit-service:8086

x-spring: &spring
  <<: *hardening
  mem_limit: 512m
  depends_on:
    postgres: { condition: service_healthy }

services:
  # ---------------------------------------------------------------- data
  postgres:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /run/postgresql]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_AUTH_PASSWORD: ${POSTGRES_AUTH_PASSWORD:?}
      POSTGRES_CUSTOMER_PASSWORD: ${POSTGRES_CUSTOMER_PASSWORD:?}
      POSTGRES_TRANSACTION_PASSWORD: ${POSTGRES_TRANSACTION_PASSWORD:?}
      POSTGRES_RISK_PASSWORD: ${POSTGRES_RISK_PASSWORD:?}
      POSTGRES_NOTIFICATION_PASSWORD: ${POSTGRES_NOTIFICATION_PASSWORD:?}
      POSTGRES_AUDIT_PASSWORD: ${POSTGRES_AUDIT_PASSWORD:?}
      POSTGRES_MLFLOW_PASSWORD: ${POSTGRES_MLFLOW_PASSWORD:?}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------- MLOps
  mlflow:
    <<: *hardening
    build: { context: ../.., dockerfile: mlops/mlflow/Dockerfile }
    image: ghcr.io/radahassan/riskpulse-mlflow:${IMAGE_TAG:-dev}
    mem_limit: 512m
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://mlflow_user:${POSTGRES_MLFLOW_PASSWORD:?}@postgres:5432/mlflow
      MLFLOW_ALLOWED_HOSTS: "mlflow:5000,localhost:5000,127.0.0.1:5000"
    volumes: [mlartifacts:/mlartifacts]
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["127.0.0.1:5000:5000"]

  ml-serving:
    <<: *hardening
    build: { context: ../.., dockerfile: mlops/serving/Dockerfile }
    image: ghcr.io/radahassan/riskpulse-ml-serving:${IMAGE_TAG:-dev}
    mem_limit: 1g
    environment:
      SERVICE_KEY: ${SERVICE_KEY:?}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_URI: models:/riskpulse-fraud@champion
      MLFLOW_HTTP_REQUEST_TIMEOUT: "10"
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "1"
    depends_on:
      mlflow: { condition: service_healthy }
    ports: ["127.0.0.1:8000:8000"]

  # one-shot: Training -> Evaluation -> Statistical validation -> Registry -> Deployment
  mlops-pipeline:
    build: { context: ../.., dockerfile: mlops/pipeline/Dockerfile }
    image: ghcr.io/radahassan/riskpulse-mlops-pipeline:${IMAGE_TAG:-dev}
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      SERVING_URL: http://ml-serving:8000
      SERVICE_KEY: ${SERVICE_KEY:?}
    depends_on:
      mlflow: { condition: service_healthy }
      ml-serving: { condition: service_healthy }

  # ---------------------------------------------------------------- backend
  auth-service:
    <<: *spring
    build: { context: ../.., dockerfile: backend/Dockerfile, args: { MODULE: auth-service, PORT: "8081" } }
    image: ghcr.io/radahassan/riskpulse-auth-service:${IMAGE_TAG:-dev}
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_AUTH_PASSWORD:?}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?run scripts/dev-up.ps1}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?}
      JWT_KEY_ID: ${JWT_KEY_ID:-rp-local-1}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?}
      SEED_ANALYST_PASSWORD: ${SEED_ANALYST_PASSWORD:?}

  customer-service:
    <<: *spring
    build: { context: ../.., dockerfile: backend/Dockerfile, args: { MODULE: customer-service, PORT: "8082" } }
    image: ghcr.io/radahassan/riskpulse-customer-service:${IMAGE_TAG:-dev}
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/customer
      SPRING_DATASOURCE_USERNAME: customer_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_CUSTOMER_PASSWORD:?}

  transaction-service:
    <<: *spring
    build: { context: ../.., dockerfile: backend/Dockerfile, args: { MODULE: transaction-service, PORT: "8083" } }
    image: ghcr.io/radahassan/riskpulse-transaction-service:${IMAGE_TAG:-dev}
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transaction
      SPRING_DATASOURCE_USERNAME: transaction_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_TRANSACTION_PASSWORD:?}
      RISK_SERVICE_URL: http://risk-service:8084

  risk-service:
    <<: *spring
    build: { context: ../.., dockerfile: backend/Dockerfile, args: { MODULE: risk-service, PORT: "8084" } }
    image: ghcr.io/radahassan/riskpulse-risk-service:${IMAGE_TAG:-dev}
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/risk
      SPRING_DATASOURCE_USERNAME: risk_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_RISK_PASSWORD:?}
      ML_SERVING_URL: http://ml-serving:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      TRANSACTION_SERVICE_URL: http://transaction-service:8083

  notification-service:
    <<: *spring
    build: { context: ../.., dockerfile: backend/Dockerfile, args: { MODULE: notification-service, PORT: "8085" } }
    image: ghcr.io/radahassan/riskpulse-notification-service:${IMAGE_TAG:-dev}
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification
      SPRING_DATASOURCE_USERNAME: notification_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_NOTIFICATION_PASSWORD:?}

  audit-service:
    <<: *spring
    build: { context: ../.., dockerfile: backend/Dockerfile, args: { MODULE: audit-service, PORT: "8086" } }
    image: ghcr.io/radahassan/riskpulse-audit-service:${IMAGE_TAG:-dev}
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/audit
      SPRING_DATASOURCE_USERNAME: audit_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_AUDIT_PASSWORD:?}

  api-gateway:
    <<: *hardening
    mem_limit: 512m
    build: { context: ../.., dockerfile: backend/Dockerfile, args: { MODULE: api-gateway, PORT: "8080" } }
    image: ghcr.io/radahassan/riskpulse-api-gateway:${IMAGE_TAG:-dev}
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"
      JWT_ISSUER: riskpulse-auth
      JWT_JWKS_URI: http://auth-service:8081/.well-known/jwks.json
      SERVICE_KEY: ${SERVICE_KEY:?}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      TRUST_FORWARDED_FOR: "true"
      RATE_LIMIT_IP_PER_MIN: ${RATE_LIMIT_IP_PER_MIN:-300}
      RATE_LIMIT_USER_PER_MIN: ${RATE_LIMIT_USER_PER_MIN:-600}
      AUTH_SERVICE_URL: http://auth-service:8081
      CUSTOMER_SERVICE_URL: http://customer-service:8082
      TRANSACTION_SERVICE_URL: http://transaction-service:8083
      RISK_SERVICE_URL: http://risk-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      AUDIT_SERVICE_URL: http://audit-service:8086
      ML_SERVING_URL: http://ml-serving:8000
    depends_on:
      auth-service: { condition: service_started }
    ports: ["127.0.0.1:8080:8080"]

  frontend:
    <<: *hardening
    mem_limit: 128m
    build: { context: ../.., dockerfile: frontend/Dockerfile }
    image: ghcr.io/radahassan/riskpulse-frontend:${IMAGE_TAG:-dev}
    depends_on:
      api-gateway: { condition: service_started }
    ports: ["127.0.0.1:5173:8080"]

  # ---------------------------------------------------------------- observability
  postgres-exporter:
    <<: *hardening
    image: prometheuscommunity/postgres-exporter:v0.21.1@sha256:3b8e05a84282cd1199ad2fb6c66f362738bf4c68c1547d8f4226a34a7dd6d8d7
    mem_limit: 64m
    environment:
      DATA_SOURCE_NAME: postgresql://exporter:${POSTGRES_EXPORTER_PASSWORD:?}@postgres:5432/postgres?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    mem_limit: 384m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  alertmanager:
    <<: *hardening
    image: prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    mem_limit: 64m
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - amdata:/alertmanager
    ports: ["127.0.0.1:9093:9093"]

  alert-sink:
    <<: *hardening
    build: { context: ./alert-sink }
    image: ghcr.io/radahassan/riskpulse-alert-sink:${IMAGE_TAG:-dev}
    mem_limit: 64m

  grafana:
    <<: *hardening
    image: grafana/grafana:13.3.2@sha256:81556409ba48b2b922e0adb69a2511337d8ba7578f11962eefa6149a2d815101
    mem_limit: 256m
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      prometheus: { condition: service_started }
    ports: ["127.0.0.1:3000:3000"]

volumes:
  pgdata:
  mlartifacts:
  promdata:
  amdata:
  grafanadata:
