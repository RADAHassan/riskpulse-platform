apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: riskpulse
spec:
  limits:
    - type: Container
      default: { cpu: 500m, memory: 512Mi }
      defaultRequest: { cpu: 100m, memory: 128Mi }
      max: { cpu: "2", memory: 2Gi }
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: riskpulse
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 16Gi
    limits.cpu: "32"
    limits.memory: 32Gi
    pods: "80"
    persistentvolumeclaims: "6"
