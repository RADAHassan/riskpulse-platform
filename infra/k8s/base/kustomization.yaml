apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: riskpulse

resources:
  - namespace.yaml
  - config.yaml
  - quota.yaml
  - postgres.yaml
  - mlflow.yaml
  - api-gateway.yaml
  - auth-service.yaml
  - customer-service.yaml
  - transaction-service.yaml
  - risk-service.yaml
  - notification-service.yaml
  - audit-service.yaml
  - ml-serving.yaml
  - frontend.yaml
  - ingress.yaml

configMapGenerator:
  - name: postgres-init
    files:
      - init-databases.sh=init-databases.sh
    options:
      disableNameSuffixHash: true
