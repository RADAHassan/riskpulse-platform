# Training -> Evaluation -> Statistical validation -> Registry -> Deployment (import mode: no dataset in the image).
# Re-run with: kubectl -n riskpulse delete job mlops-pipeline --ignore-not-found && kubectl apply -k infra/k8s/jobs
apiVersion: v1
kind: ServiceAccount
metadata: { name: mlops-pipeline, namespace: riskpulse }
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mlops-pipeline
  namespace: riskpulse
  labels: { app.kubernetes.io/name: mlops-pipeline, app.kubernetes.io/part-of: riskpulse }
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app.kubernetes.io/name: mlops-pipeline, app.kubernetes.io/part-of: riskpulse, app: mlops-pipeline }
    spec:
      serviceAccountName: mlops-pipeline
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: pipeline
          image: ghcr.io/radahassan/riskpulse-mlops-pipeline:0.0.0
          imagePullPolicy: IfNotPresent
          args: ["python", "mlops/pipeline/run_pipeline.py", "--mode", "import"]
          env:
            - { name: MLFLOW_TRACKING_URI, value: "http://mlflow:5000" }
            - { name: SERVING_URL, value: "http://ml-serving:8000" }
            - name: SERVICE_KEY
              valueFrom: { secretKeyRef: { name: riskpulse-secrets, key: SERVICE_KEY } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1536Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 512Mi }
