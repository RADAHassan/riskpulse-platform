# Pods used by `kyverno test`: one compliant pod and one pod per violation.
apiVersion: v1
kind: Pod
metadata: { name: good-pod, namespace: riskpulse, labels: { app.kubernetes.io/name: good } }
spec:
  containers:
    - name: app
      image: ghcr.io/radahassan/riskpulse-risk-service:3f2a9c1
      securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
      resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
      livenessProbe: { httpGet: { path: /live, port: 8080 }, periodSeconds: 10 }
      readinessProbe: { httpGet: { path: /ready, port: 8080 }, periodSeconds: 5 }
---
