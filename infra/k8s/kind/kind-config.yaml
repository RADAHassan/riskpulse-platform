# 1 control-plane + 2 workers. The control-plane maps the ingress controller to localhost:8088.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: riskpulse
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - { containerPort: 80, hostPort: 8088, listenAddress: "127.0.0.1", protocol: TCP }
      - { containerPort: 443, hostPort: 8443, listenAddress: "127.0.0.1", protocol: TCP }
  - role: worker
  - role: worker
